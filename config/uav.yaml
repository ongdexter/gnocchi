# UAV: GPS-only. topics.odom empty means no clock, no keyframes, no graph -- the
# node becomes a GNSS-to-local-frame converter. No IMU: the output pose's yaw
# comes from the heading prior, but roll/pitch is always level (0). UNVERIFIED
# on real UAV data.
/**/gnocchi:
  ros__parameters:
    enable_gnss: true
    topics:
      odom: ""
      gnss: mavros/global_position/global
      # Every GPS instance; whichever reports a valid yaw is used.
      gnss_heading: ["mavros/gpsstatus/gps1/raw", "mavros/gpsstatus/gps2/raw"]
      # FCU-fused (baro+GPS+IMU) altitude relative to home, in place of the raw
      # single-fix GNSS altitude for the output pose's z.
      rel_altitude: mavros/global_position/rel_alt
      output_odom: odom_map
      output_pose: pose_map
    heading:
      # Dual-antenna moving-baseline heading needs a receiver that supports it.
      # Set false to fall back to heading.compass_topic (mavros' compass_hdg,
      # default mavros/global_position/compass_hdg) instead -- worse accuracy,
      # and no per-message sigma, so heading.compass_sigma_deg (default 5.0) is
      # assumed fixed.
      use_gnss_heading: true
    extrinsics:
      # GNSS antenna in base_link (FLU)
      gnss_antenna: {x: -0.15, y: -0.25, z: 0.0}
    frames:
      # ENU / UTM, absolute.
      world: world
      # NWU: +X north, +Y west. Origin is the first accepted fix.
      map: uav_map
      map_yaw_deg: 90.0
      base_link: base_link
    # gps_only (no topics.odom) never gets a live TF edge to base_link -- nothing
    # in this stack looks up base_link via TF, and it would conflict with the
    # ZED's own VIO output (driver_launch's pos_tracking.publish_tf), which does
    # own it. publish_tf here only turns on the static world -> uav_map edge that
    # waypoint conversion and cross-vehicle frame reprojection need.
    publish_tf: true
    gnss:
      sigma: 0.5
      max_sigma: 3.0
