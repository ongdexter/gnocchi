# UGV: RKO-LIO odometry with GNSS position and dual-antenna heading priors.
# Fuses the RAW fix: it reports the antenna, so the lever arm applies, and it is
# a measurement rather than an estimator posterior. See README for the rest.
/**/gnocchi:
  ros__parameters:
    topics:
      odom: rko_lio/odometry
      gnss: mavros/global_position/raw/fix
      # Every GPS instance; whichever reports a valid yaw is used.
      gnss_heading: ["mavros/gpsstatus/gps1/raw", "mavros/gpsstatus/gps2/raw"]
      output_odom: odom_map
      output_pose: pose_map
    extrinsics:
      # GNSS antenna in base_link (FLU)
      gnss_antenna: {x: -0.15, y: -0.25, z: 0.0}
    frames:
      # ENU / UTM, absolute.
      world: world
      # NWU: +X north, +Y west. Origin is the first accepted fix.
      map: ugv_map
      map_yaw_deg: 90.0
      odom: odom
      base_link: base_link
      expect_odom_child: base_link
    publish_tf: true
    keyframe:
      distance: 0.5
      angle_deg: 10.0
      max_time: 1.0
    odom:
      # Translation is where lidar odometry is strong: rigid over a short window,
      # so the fused pose follows the lidar locally.
      translation_floor: 0.005
      # Loose enough that heading still owns yaw, but ~5x tighter than the lidar's
      # measured per-keyframe yaw drift rather than ~70x.
      rotation_floor: 0.02
      # This, not gnss.sigma, sets the distance over which GNSS may deform the
      # chain: with a rigid chain the solution is just its best rigid fit to the
      # GNSS priors, and scaling all those sigmas together does not move it.
      translation_sigma_per_m: 0.05
      rotation_sigma_per_m: 0.005
      rotation_sigma_per_rad: 0.02
      # Gravity-aligned odometry's own roll/pitch; yaw is the heading prior's.
      attitude_sigma: 0.05
      # Gravity-aligned odometry holds z; GNSS altitude is not fused.
      z_sigma: 0.1
    gnss:
      # The fix's error is ~3 cm of noise on a ~0.5 m bias that decorrelates over
      # 20-40 s, so samples closer together than this carry no new information and
      # only make the graph overconfident in the GNSS frame.
      min_interval: 30.0
      sigma: 0.5   # raw fix; its own reported sigma is ~0.30
      max_sigma: 2.0
      robust_k: 1.345
      # Altitude is not fused: it is the weakest axis of the fix and the lidar
      # odometry's z is better, so letting them fight only injects corrections.
      fuse_altitude: false
      sigma_z: 3.0
    heading:
      # Dual-antenna heading error is white once it is timed correctly, so every
      # keyframe may have one.
      min_interval: 0.0
      # The message is stamped later than the epoch it describes. Measured on this
      # airframe: the residual against odometry correlates with yaw rate at -0.88
      # and collapses from 4.15 to 1.26 deg -- its own claimed accuracy -- at
      # -0.240 s. RE-MEASURE THIS if the receiver, link or mavros version changes.
      # It measured 218 / 243 / 267 ms across three runs, but the response is flat
      # from roughly -0.18 to -0.45, so being in the right region is what matters and
      # the exact value does not. Re-measure with gnocchi_tuning/lag_across_runs.py
      # if the receiver, link or mavros version changes.
      time_offset: -0.240
      # Huber, whitened. Survives the occasional bad baseline without letting it
      # rotate the graph.
      robust_k: 1.345
      # Do not interpolate a heading across a gap longer than this.
      max_gap: 1.0
      # Skip the prior while the heading slews faster than this. Any residual lag
      # error costs yaw_rate * error, so mid-turn priors are the least trustworthy.
      # 0 disables. See below: with the lag corrected this buys little, so it is off.
      max_rate: 0.0
      # Bounds on the receiver-reported hdg_acc. The floor stops an
      # over-confident report pinning yaw absolutely; the ceiling rejects
      # headings the receiver already knows are bad, e.g. on RTK loss.
      gnss_sigma_floor: 0.005
      gnss_sigma_max: 0.35
    origin_z_sigma: 0.5
    max_measurement_age: 0.5
    optimizer:
      fixed_lag: false
      lag_time: 30.0
      min_keyframes: 5

    debug:
      # Publishes the pose GNSS alone would give, to overlay in RViz.
      publish_gnss_only: true
      gnss_only_topic: debug/gnss_only
